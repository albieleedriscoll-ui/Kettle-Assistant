<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Website assistant</title>
<style>
/* One page, two uses: opened directly it is a full chat page for one restaurant;
   opened with &embed=1 it fills the pop-up that widget.js adds to a restaurant's own site. */
:root{
  --accent:#1C6A4F; --accent-fg:#FFFFFF;
  --accent-soft:#D9ECE3;
  --bg:#F2F5F3; --surface:#FFFFFF; --fg:#14201A; --muted:#56655E; --line:#D3DCD7;
  --amber:#7F5300; --amber-soft:#FBE9C2; --red:#9E3219; --red-soft:#F8DDD5;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@supports (color:color-mix(in srgb,red,white)){
  :root{--accent-soft:color-mix(in srgb,var(--accent) 14%,white)}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
.page{min-height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:20px max(16px,env(safe-area-inset-right)) 20px max(16px,env(safe-area-inset-left))}
.chat{width:100%;max-width:560px;flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;
  place-items:center;font-weight:700;flex:none;letter-spacing:.02em}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{font:inherit;font-size:22px;line-height:1;width:36px;height:36px;border-radius:50%;border:0;background:transparent;
  color:var(--muted);cursor:pointer;flex:none}
.close:hover{background:var(--bg)}
.log{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg);
  overscroll-behavior:contain}
.msg{max-width:88%;padding:9px 13px;border-radius:14px;white-space:pre-line;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.guest{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.note{align-self:center;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:13px;
  text-align:center;max-width:94%;white-space:normal}
.msg .actions,.msg form{white-space:normal}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:7px 14px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.field:focus-visible,#ask:focus-visible,.close:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
form.handoff{display:grid;gap:8px;margin-top:10px}
form.handoff label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.field,#ask{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.pill{display:block;width:fit-content;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;
  background:var(--amber-soft);color:var(--amber);margin-top:10px}
.pill.urgent{background:var(--red-soft);color:var(--red)}
.err{margin:0;color:var(--red);font-size:13px}
.small{margin:0;font-size:12.5px;color:var(--muted)}
.typing{display:flex;gap:5px;align-items:center;min-height:22px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.try{padding:10px 14px 0;border-top:1px solid var(--line)}
.try p{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--fg);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.composer{display:flex;gap:8px;padding:10px 14px}
.try[hidden] + .composer{border-top:1px solid var(--line)}
.fine{margin:0;padding:0 14px 12px;font-size:12.5px;color:var(--muted)}
.foot{margin:0;font-size:13px;color:var(--muted);text-align:center;max-width:560px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.embed .page{padding:0;gap:0}
body.embed .chat{max-width:none;border:0;border-radius:0}
body.embed .foot{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="page">
  <main class="chat" aria-label="Chat">
    <header class="chat-head">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div class="who"><b id="bizName">Loading…</b><small id="bizLabel"></small></div>
      <button class="close" id="closeBtn" type="button" aria-label="Close chat" hidden>&times;</button>
    </header>
    <div class="log" id="log" role="log" aria-live="polite"></div>
    <div class="try" id="try" hidden>
      <p>Try asking</p>
      <div class="chips" id="chips"></div>
    </div>
    <form class="composer" id="composer">
      <label class="sr" for="ask">Your question</label>
      <input id="ask" autocomplete="off" maxlength="500" placeholder="Ask a question" disabled>
      <button class="btn" type="submit" id="sendBtn" disabled>Send</button>
    </form>
    <p class="fine" id="fine"></p>
  </main>
  <p class="foot" id="foot"></p>
</div>

<script>
(function () {
"use strict";

var qs = new URLSearchParams(location.search);
var venueId = (qs.get("venue") || "copper-kettle").toLowerCase().replace(/[^a-z0-9-]/g, "");
var embed = qs.get("embed") === "1";
if (embed) document.body.classList.add("embed");

var $ = function (id) { return document.getElementById(id); };
var logEl = $("log"), askEl = $("ask"), sendBtn = $("sendBtn"), tryEl = $("try"), chipsEl = $("chips");
var cfg = null, turns = [], busy = false, formCount = 0;
var STORE = "kc-chat-" + venueId;

var FIELD = {
  date: { label: "Date", ph: "e.g. Friday 12 December" },
  size: { label: "Number of people", ph: "e.g. 12", mode: "numeric" },
  name: { label: "Your name", ph: "e.g. Sam" },
  contact: { label: "Phone or email", ph: "e.g. 07700 900123" }
};

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function scrollEnd() { logEl.scrollTop = logEl.scrollHeight; }
function addMsg(role, text) {
  var m = el("div", "msg " + role);
  m.append(el("span", "t", text));
  logEl.append(m);
  scrollEnd();
  return m;
}
function addTyping() {
  var m = el("div", "msg bot"), t = el("div", "typing");
  t.setAttribute("aria-label", "Typing");
  t.append(el("i"), el("i"), el("i"));
  m.append(t);
  logEl.append(m);
  scrollEnd();
  return m;
}
function remember(role, content) {
  turns.push({ role: role, content: content });
  try { sessionStorage.setItem(STORE, JSON.stringify(turns.slice(-30))); } catch (e) {}
}
function setBusy(on) {
  busy = on;
  sendBtn.disabled = on || !cfg;
}

/* ---------- booking button ---------- */
function bookingControl() {
  if (cfg.bookingUrl) {
    var a = el("a", "btn", cfg.bookingLabel);
    a.href = cfg.bookingUrl;
    a.target = "_blank";
    a.rel = "noopener";
    return a;
  }
  var shown = false;
  var b = el("button", "btn", cfg.bookingLabel);
  b.type = "button";
  b.addEventListener("click", function () {
    if (shown) return;
    shown = true;
    addMsg("note", "In your version, this button opens your own booking page, so bookings go straight into the system you already use.");
  });
  return b;
}

/* ---------- passing something to the team ---------- */
function addForm(host, handoff, question) {
  var f = el("form", "handoff");
  f.noValidate = true;
  var id = "h" + (++formCount), inputs = {};
  var pill = el("span", "pill" + (handoff.urgent ? " urgent" : ""), handoff.type);
  host.append(pill);
  handoff.fields.forEach(function (k) {
    var F = FIELD[k];
    if (!F) return;
    var lab = el("label");
    lab.htmlFor = id + "-" + k;
    lab.append(document.createTextNode(F.label));
    var inp = el("input", "field");
    inp.id = id + "-" + k;
    inp.name = k;
    inp.placeholder = F.ph;
    inp.maxLength = 120;
    inp.autocomplete = k === "name" ? "name" : "off";
    if (F.mode) inp.inputMode = F.mode;
    lab.append(inp);
    f.append(lab);
    inputs[k] = inp;
  });
  var err = el("p", "err");
  err.hidden = true;
  err.setAttribute("role", "alert");
  var sub = el("button", "btn", "Send to the team");
  sub.type = "submit";
  var row = el("div", "actions");
  row.append(sub);
  var privacy = el("p", "small", "Your details go to the team at " + cfg.name + " so they can reply.");
  f.append(err, row, privacy);

  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = {};
    Object.keys(inputs).forEach(function (k) { v[k] = inputs[k].value.trim(); });
    var digits = (v.contact || "").replace(/\D/g, "").length;
    var looksRight = digits >= 7 || /^\S+@\S+\.\S+$/.test(v.contact || "");
    if (!v.name || !looksRight) {
      err.textContent = "Add your name and a phone number or email so the team can reply.";
      err.hidden = false;
      return;
    }
    err.hidden = true;
    sub.disabled = true;
    sub.textContent = "Sending…";

    var data = new URLSearchParams({
      "form-name": "enquiry-" + cfg.id,
      "bot-field": "",
      subject: (handoff.urgent ? "URGENT: " : "") + handoff.type + " from your website assistant (" + cfg.name + ")",
      venue: cfg.name,
      type: handoff.type,
      urgent: handoff.urgent ? "Yes" : "No",
      question: question || "",
      summary: handoff.summary || "",
      name: v.name,
      contact: v.contact,
      date: v.date || "",
      size: v.size || "",
      sent: new Date().toLocaleString("en-GB", { timeZone: "Europe/London" })
    });

    fetch("/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: data.toString()
    }).then(function (res) {
      if (!res.ok) throw new Error("status " + res.status);
      f.querySelectorAll("input,button").forEach(function (x) { x.disabled = true; });
      sub.textContent = "Sent";
      var first = v.name.split(/\s+/)[0];
      var t = "Thanks, " + first + ". I've passed this to the team with your details and they'll be in touch. " +
        (handoff.fields.indexOf("date") >= 0 ? "Nothing is booked until they confirm." : "");
      addMsg("bot", t.trim());
      remember("assistant", t.trim());
    }).catch(function () {
      sub.disabled = false;
      sub.textContent = "Send to the team";
      err.textContent = "Sorry, that didn't send. Please try again, or call " + cfg.phone + ".";
      err.hidden = false;
    });
  });

  host.append(f);
  scrollEnd();
}

/* ---------- showing an answer ---------- */
function renderBot(r, question) {
  var m = addMsg("bot", r.reply);
  remember("assistant", r.reply);
  var acts = [];
  if (r.link) acts.push(bookingControl());
  if (r.offer && !r.handoff) {
    var b = el("button", "btn ghost", r.offer.label);
    b.type = "button";
    b.addEventListener("click", function () {
      b.disabled = true;
      var lead = addMsg("bot", r.offer.lead || "Sure. Pop your details in and I'll pass it on.");
      addForm(lead, r.offer.handoff, question);
    });
    acts.push(b);
  }
  if (acts.length) {
    var a = el("div", "actions");
    acts.forEach(function (x) { a.append(x); });
    m.append(a);
  }
  if (r.handoff) addForm(m, r.handoff, question);
  scrollEnd();
}

function send(text) {
  text = (text || "").trim();
  if (!text || busy || !cfg) return;
  setBusy(true);
  tryEl.hidden = true;
  addMsg("guest", text);
  remember("user", text);
  var typing = addTyping();

  fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ venue: cfg.id, messages: turns.slice(-12) })
  }).then(function (res) {
    if (res.status === 429) return { reply: "You're asking faster than I can answer. Give me a minute and try again." };
    if (!res.ok) throw new Error("status " + res.status);
    return res.json();
  }).then(function (r) {
    typing.remove();
    if (!r || typeof r.reply !== "string") throw new Error("empty");
    renderBot(r, text);
  }).catch(function () {
    typing.remove();
    addMsg("bot", "Sorry, I couldn't connect just then. Please try again, or call " + cfg.phone + ".");
  }).then(function () {
    setBusy(false);
    if (!embed || window.matchMedia("(min-width: 600px)").matches) askEl.focus();
  });
}

/* ---------- start ---------- */
function initials(name) {
  var words = name.replace(/^the\s+/i, "").split(/\s+/).filter(function (w) { return /[a-z0-9]/i.test(w); });
  return ((words[0] || "?").charAt(0) + (words[1] ? words[1].charAt(0) : "")).toUpperCase();
}

function start(c) {
  cfg = c;
  document.documentElement.style.setProperty("--accent", cfg.accent);
  document.title = cfg.name + " assistant";
  $("avatar").textContent = initials(cfg.name);
  $("bizName").textContent = cfg.name;
  $("bizLabel").textContent = [cfg.label, cfg.demo ? "example business" : ""].filter(Boolean).join(" · ");
  $("fine").textContent = "AI assistant for " + cfg.name + ". It can't make or confirm bookings. For allergies, always check with the team.";
  $("foot").textContent = (cfg.demo ? cfg.name + " is a made-up business used to show how the assistant works. " : "") + "Assistant by Kettle and Co.";

  var saved = [];
  try { saved = JSON.parse(sessionStorage.getItem(STORE) || "[]"); } catch (e) {}
  addMsg("bot", cfg.greeting);
  if (Array.isArray(saved) && saved.length) {
    saved.forEach(function (t) {
      if (!t || typeof t.content !== "string") return;
      addMsg(t.role === "user" ? "guest" : "bot", t.content);
      turns.push({ role: t.role === "user" ? "user" : "assistant", content: t.content });
    });
  } else if (cfg.suggested.length) {
    cfg.suggested.forEach(function (q) {
      var chip = el("button", "chip", q);
      chip.type = "button";
      chip.addEventListener("click", function () { send(q); });
      chipsEl.append(chip);
    });
    tryEl.hidden = false;
  }
  askEl.disabled = false;
  setBusy(false);
}

$("composer").addEventListener("submit", function (e) {
  e.preventDefault();
  var v = askEl.value;
  askEl.value = "";
  send(v);
});

if (embed && window.parent !== window) {
  $("closeBtn").hidden = false;
  $("closeBtn").addEventListener("click", function () {
    window.parent.postMessage({ type: "kc-close" }, "*");
  });
}

fetch("/venues/" + encodeURIComponent(venueId) + ".json").then(function (res) {
  if (!res.ok) throw new Error("status " + res.status);
  return res.json();
}).then(start).catch(function () {
  $("bizName").textContent = "Assistant";
  addMsg("note", "This assistant isn't set up yet.");
});
})();
</script>
</body>
</html>
